rience/favicon.ico?favicon.2vob68tjqpejf.ico" sizes="256x256" type="image/x-icon"/><script src="/experience/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-full bg-[#08090b] text-white font-mono"><div hidden=""><!--$--><!--/$--></div><div class="fixed inset-0" style="background:#08090b"></div><noscript><div class="fixed inset-0 z-[100] overflow-y-auto bg-[#08090b]"><main class="mx-auto flex max-w-2xl flex-col gap-10 px-6 py-16 md:px-10"><header class="flex flex-col gap-4"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">THE FACTORY</span><h1 class="font-mono text-2xl leading-snug text-white/90 md:text-4xl">Une usine à créer des SaaS.</h1><p class="font-mono text-base leading-relaxed text-white/70 md:text-lg">Une idée entre.<br/>Un produit en sort.</p><p class="font-mono text-sm leading-relaxed text-white/50">Tout part d&#x27;une idée. Mais une idée ne suffit pas : construire un SaaS, c&#x27;est beaucoup plus que coder. Il faut comprendre. Concevoir. Construire. Tester. Lancer. Et très vite, tout se disperse — trop d&#x27;étapes, trop de friction. Alors on a transformé tout le processus en usine.</p></header><ol class="flex flex-col gap-6 border-t border-white/10 pt-8"><li class="flex flex-col gap-1"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">DISCOVER</span><p class="font-mono text-base leading-snug text-white/85">D&#x27;abord, comprendre ce qu&#x27;il faut vraiment construire.</p><p class="font-mono text-sm leading-relaxed text-white/50">Le problème. Le marché. L&#x27;opportunité.</p></li><li class="flex flex-col gap-1"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">DESIGN</span><p class="font-mono text-base leading-snug text-white/85">Puis donner une forme à l&#x27;idée.</p><p class="font-mono text-sm leading-relaxed text-white/50">Une expérience. Une interface. Un parcours.</p></li><li class="flex flex-col gap-1"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">BUILD</span><p class="font-mono text-base leading-snug text-white/85">Ensuite, le produit prend vie.</p><p class="font-mono text-sm leading-relaxed text-white/50">Interface. Logique. Données. Infrastructure.</p></li><li class="flex flex-col gap-1"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">TEST</span><p class="font-mono text-base leading-snug text-white/85">Il faut tester. Corriger. Recommencer.</p><p class="font-mono text-sm leading-relaxed text-white/50">Jusqu&#x27;à ce que tout tienne.</p></li><li class="flex flex-col gap-1"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">SHIP</span><p class="font-mono text-base leading-snug text-white/85">C&#x27;est un produit.</p><p class="font-mono text-sm leading-relaxed text-white/50">Et la Factory peut recommencer.</p></li></ol><section class="flex flex-col gap-3 border-t border-white/10 pt-8"><p class="font-mono text-sm leading-relaxed text-white/60">Un système. Autant de produits que d&#x27;opportunités.</p><p class="font-mono text-base leading-snug text-white/85">Pas une agence de plus.<br/>Pas un outil IA de plus.</p></section><section class="flex flex-col gap-4 border-t border-white/10 pt-8"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">L&#x27;OFFRE</span><p class="font-mono text-base leading-relaxed text-white/85">Le produit qui vient de sortir de la Factory, c&#x27;est ce qu&#x27;on peut vous construire : un outil logiciel sur mesure, livré déployé et vérifié.</p><p class="font-mono text-xs tracking-[0.08em] text-white/50">Construit vite · Vérifié par un audit adverse · Déployé · Documenté</p><p class="font-mono text-sm leading-relaxed text-white/55">À qui : indépendants, petites structures, services internes — un process manuel répétitif (ressaisie, tri, relance, calcul, mise en forme) et personne pour le construire. Le signal : le temps perdu par semaine, pas une liste de fonctionnalités.</p><p class="font-mono text-xs leading-relaxed text-white/40">Ce qui disqualifie : un système critique (paiement, données de santé, sécurité réglementée), ou une demande de « site vitrine ».</p></section><section class="flex flex-col gap-3 border-t border-white/10 pt-8"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">LA GRILLE</span><div class="border border-white/15"><div class="flex flex-col gap-1 border-t border-white/10 px-4 py-3 first:border-t-0"><div class="flex items-baseline justify-between gap-3"><span class="font-mono text-xs text-[#e4a24a]">01<!-- --> <!-- -->CADRAGE</span><span class="font-mono text-sm text-white/90">gratuit</span></div><p class="font-mono text-xs leading-relaxed text-white/50">Une conversation de 20 minutes : je reformule le problème, je dis si c&#x27;est faisable, ce que ça demande et ce que ça coûte. Aucun engagement.</p><span class="font-mono text-[11px] text-white/35">20 min</span></div><div class="flex flex-col gap-1 border-t border-white/10 px-4 py-3 first:border-t-0"><div class="flex items-baseline justify-between gap-3"><span class="font-mono text-xs text-[#e4a24a]">02<!-- --> <!-- -->PROTOTYPE</span><span class="font-mono text-sm text-white/90">2 400 €</span></div><p class="font-mono text-xs leading-relaxed text-white/50">Un flux critique qui fonctionne, déployé, testé, avec son audit.</p><span class="font-mono text-[11px] text-white/35">2 à 3 jours</span></div><div class="flex flex-col gap-1 border-t border-white/10 px-4 py-3 first:border-t-0"><div class="flex items-baseline justify-between gap-3"><span class="font-mono text-xs text-[#e4a24a]">03<!-- --> <!-- -->OUTIL COMPLET</span><span class="font-mono text-sm text-white/90">à partir de 6 900 €</span></div><p class="font-mono text-xs leading-relaxed text-white/50">3 à 5 flux, intégrations avec l&#x27;existant, audit complet, documentation, déploiement.</p><span class="font-mono text-[11px] text-white/35">2 à 3 semaines</span></div><div class="flex flex-col gap-1 border-t border-white/10 px-4 py-3 first:border-t-0"><div class="flex items-baseline justify-between gap-3"><span class="font-mono text-xs text-[#e4a24a]">04<!-- --> <!-- -->SUIVI (option)</span><span class="font-mono text-sm text-white/90">190 €/mois</span></div><p class="font-mono text-xs leading-relaxed text-white/50">Évolutions, corrections, veille de bon fonctionnement.</p><span class="font-mono text-[11px] text-white/35">mensuel</span></div></div></section><section class="flex flex-col gap-3 border-t border-white/10 pt-8"><span class="font-mono text-xs tracking-[0.2em] text-[#e4a24a]">PROGRAMME DE LANCEMENT — 3 PLACES</span><p class="font-mono text-sm leading-relaxed text-white/80">Tarif réduit en échange d&#x27;un retour documenté.</p><p class="font-mono text-sm text-white/90">Prototype 1 200 € · Outil complet dès 3 450 €</p><p class="font-mono text-xs leading-relaxed text-white/45">En échange : le droit de documenter le projet publiquement — étude de cas, avant/après, temps gagné, difficulté rencontrée — avec l&#x27;accord écrit du client sur le contenu publié.</p></section><section class="flex flex-col gap-3 border-t border-white/10 pt-8"><h2 class="font-mono text-lg leading-snug text-white/90 md:text-2xl">Vous apportez l&#x27;opportunité.<br/>La Factory la transforme en produit.</h2><p class="font-mono text-sm"><a href="mailto:madzimba.os@gmail.com?subject=BruceOS%20%E2%80%94%20demande%20de%20construction&amp;body=Bonjour%2C%0A%0ALe%20probl%C3%A8me%20que%20je%20veux%20faire%20dispara%C3%AEtre%20%3A%0A%0ALe%20temps%20que%20%C3%A7a%20me%20co%C3%BBte%20chaque%20semaine%20%3A%0A%0ACe%20que%20j&#x27;utilise%20aujourd&#x27;hui%20pour%20le%20faire%20%3A%0A" class="text-[#e4a24a] underline underline-offset-4">Écrire à <!-- -->madzimba.os@gmail.com</a></p><p class="font-mono text-xs leading-relaxed text-white/40">La mise en scène 3D qui raconte ce parcours nécessite JavaScript. Le texte ci-dessus reste la version complète et lisible du récit.</p></section></main></div></noscript><!--$--><!--/$--><script src="/experience/_next/stati
